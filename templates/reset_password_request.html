{% extends "base.html" %}

{% block title %}Reset password - NeuraLib{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center mb-3">Reset your password</h2>
                <p class="text-muted text-center mb-4">Enter the email you registered with and we'll send you a link to reset your password.</p>
                <form method="POST" action="{{ url_for('reset_password_request') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" required autofocus>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Send reset link</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <p><a href="{{ url_for('login') }}">Back to login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
