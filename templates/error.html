{% extends "base.html" %}

{% block title %}{{ code }} - NeuraLib{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center py-5">
            <i class="fas {{ icon }} fa-3x mb-3" style="color: var(--primary-color);"></i>
            <h1 class="mb-2" style="color: var(--primary-color);">{{ code }}</h1>
            <p class="text-muted mb-4">{{ message }}</p>
            <a href="{{ url_for('home') if current_user.is_authenticated else url_for('landing') }}" class="btn btn-primary">
                <i class="fas fa-home me-1"></i> Back to NeuraLib
            </a>
        </div>
    </div>
</div>
{% endblock %}
